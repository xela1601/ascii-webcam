name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-macos:
    name: Build ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../ascii-webcam-${{ matrix.target }}.tar.gz ascii-webcam
          cd ../../..
          shasum -a 256 ascii-webcam-${{ matrix.target }}.tar.gz > ascii-webcam-${{ matrix.target }}.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ascii-webcam-${{ matrix.target }}
          path: |
            ascii-webcam-${{ matrix.target }}.tar.gz
            ascii-webcam-${{ matrix.target }}.tar.gz.sha256

  build-linux:
    name: Build .deb ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation deps
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build .deb package
        run: |
          cargo install cargo-deb
          cargo deb --target ${{ matrix.target }} --no-build

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: ascii-webcam-linux-${{ matrix.arch }}
          path: target/${{ matrix.target }}/debian/ascii-webcam_*.deb

  release:
    name: Publish release
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display structure
        run: ls -R artifacts/

      - name: Read macOS SHA256 sums
        id: hashes
        run: |
          ARM_SHA=$(cat artifacts/ascii-webcam-aarch64-apple-darwin.tar.gz.sha256 | awk '{print $1}')
          X86_SHA=$(cat artifacts/ascii-webcam-x86_64-apple-darwin.tar.gz.sha256 | awk '{print $1}')
          echo "arm_sha=$ARM_SHA" >> $GITHUB_OUTPUT
          echo "x86_sha=$X86_SHA" >> $GITHUB_OUTPUT

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: RELEASE_BODY.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_BODY.md
          files: artifacts/*
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew formula in tap
        env:
          TAP_REPO: xela1601/homebrew-tap
          GH_TOKEN: ${{ secrets.TAP_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          ARM_SHA="${{ steps.hashes.outputs.arm_sha }}"
          X86_SHA="${{ steps.hashes.outputs.x86_sha }}"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git" tap-repo
          cd tap-repo
          mkdir -p Formula

          cat > Formula/ascii-webcam.rb << EOF
          class AsciiWebcam < Formula
            desc "Terminal-based webcam that renders your live feed as colored ASCII art"
            homepage "https://github.com/xela1601/ascii-webcam"
            version "$VERSION"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/xela1601/ascii-webcam/releases/download/$TAG/ascii-webcam-aarch64-apple-darwin.tar.gz"
                sha256 "$ARM_SHA"
              else
                url "https://github.com/xela1601/ascii-webcam/releases/download/$TAG/ascii-webcam-x86_64-apple-darwin.tar.gz"
                sha256 "$X86_SHA"
              end
            end

            def install
              bin.install "ascii-webcam"
            end

            test do
              system "#{bin}/ascii-webcam", "--version"
            end
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ascii-webcam.rb
          git commit -m "ascii-webcam $TAG" || true
          git push

      - name: Update apt repo on gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          DEB_AMD64=$(ls artifacts/ascii-webcam_*_amd64.deb)
          DEB_ARM64=$(ls artifacts/ascii-webcam_*_arm64.deb)

          git fetch origin gh-pages
          git checkout gh-pages
          git reset --hard origin/gh-pages

          mkdir -p apt/pool/main/a/ascii-webcam
          cp "$DEB_AMD64" apt/pool/main/a/ascii-webcam/
          cp "$DEB_ARM64" apt/pool/main/a/ascii-webcam/

          mkdir -p apt/dists/stable/main/binary-amd64
          mkdir -p apt/dists/stable/main/binary-arm64

          cd apt
          dpkg-scanpackages --arch amd64 pool/ > dists/stable/main/binary-amd64/Packages
          dpkg-scanpackages --arch arm64 pool/ > dists/stable/main/binary-arm64/Packages
          gzip -kf dists/stable/main/binary-amd64/Packages
          gzip -kf dists/stable/main/binary-arm64/Packages
          cd ..

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apt/
          git commit -m "ascii-webcam $TAG" || true
          git push origin gh-pages
